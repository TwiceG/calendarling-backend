name: Daily Email Trigger

on:
  schedule:
    - cron: '0 4 * * *'  # This will run the job every day at 4 AM UTC
  workflow_dispatch:  # Allows manual triggering of the job

jobs:
  send_daily_email:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code (optional)
      - name: Checkout code
        uses: actions/checkout@v2

      # Trigger Daily Email with Bearer token from GitHub Secrets
      - name: Trigger Daily Email
        run: |
          curl -X POST https://calendarling-backend.fly.dev/api/send-daily-note-email \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DAILY_EMAIL_TOKEN }}" \
            -d '{}'
